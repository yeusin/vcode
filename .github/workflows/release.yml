name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
            rust_target: aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
            rust_target: x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ""
            rust_target: x86_64-unknown-linux-gnu
          - platform: windows-latest
            args: ""
            rust_target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown,${{ matrix.rust_target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          prefix-key: v1-${{ matrix.platform }}-${{ matrix.rust_target }}
          workspaces: |
            .
            src-tauri

      - name: Parse version from release tag
        id: version
        shell: bash
        run: |
          TAG="${{ github.event.release.tag_name }}"
          VERSION="${TAG#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-].+)?$ ]]; then
            echo "Invalid release tag version: $TAG" >&2
            exit 1
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Inject release version into manifests
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.value }}"
          PY_BIN="$(command -v python3 || command -v python)"
          "$PY_BIN" - <<PY
          from pathlib import Path
          import json, re

          version = "${VERSION}"

          for toml_path in [Path("Cargo.toml"), Path("src-tauri/Cargo.toml")]:
              text = toml_path.read_text()
              text = re.sub(r'(?m)^version = ".*"$', f'version = "{version}"', text, count=1)
              toml_path.write_text(text)

          conf_path = Path("src-tauri/tauri.conf.json")
          conf = json.loads(conf_path.read_text())
          conf["version"] = version
          conf_path.write_text(json.dumps(conf, indent=2) + "\n")
          PY

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install trunk and wasm-bindgen-cli
        uses: taiki-e/install-action@v2
        with:
          tool: trunk,wasm-bindgen-cli

      - name: Build and upload Tauri bundles
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: src-tauri
          releaseId: ${{ github.event.release.id }}
          args: ${{ matrix.args }}
